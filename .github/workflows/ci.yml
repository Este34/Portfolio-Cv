name: CI

on:
  push:
    branches: [master]
  pull_request:

# Une seule exécution par branche : pousser trois fois d'affilée ne doit pas
# occuper trois agents à vérifier des états déjà périmés.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Placé en premier : c'est la vérification dont l'échec doit interrompre
      # tout le reste. Publier un nom d'organisme ne se rattrape pas.
      - name: Anonymisation
        run: npm run verifier:anonymat

      # Les tables SQL sont régénérées ici, puis comparées à ce qui est versionné
      # (voir la dernière étape). C'est de la manipulation de chaînes, donc
      # reproductible au bit près d'une machine à l'autre.
      #
      # Les **vecteurs**, eux, ne sont pas régénérés, et c'est délibéré. Ils
      # coûteraient le téléchargement du modèle à chaque exécution pour un
      # résultat qui n'a aucune raison d'être identique au bit près entre deux
      # architectures : comparer les octets produirait des échecs qui ne
      # signalent rien. C'est `verifier:embeddings`, lancé avant chaque build,
      # qui garantit qu'ils collent au contenu — il compare les identifiants et
      # les textes, pas les flottants.
      - name: Génération des données
        run: npm run generer:donnees

      - name: Lint
        run: npm run lint

      # `npm run typecheck` commence par `next typegen`. Sans lui, le type
      # global `PageProps` n'existe pas encore — il est produit par Next dans
      # .next/types — et les dix-huit pages échouent sur « Cannot find name
      # PageProps ». En local le dossier traîne d'un build précédent, ce qui
      # masquait entièrement le problème : cette étape n'est jamais passée en
      # intégration depuis l'introduction des routes typées.
      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Le contenu peut évoluer sans que personne ne relance la génération.
      # Si un artefact généré diffère de ce qui est versionné, le site servirait
      # des extraits désynchronisés de leurs vecteurs.
      - name: Les artefacts générés sont à jour
        run: git diff --exit-code -- public/data || (echo "::error::public/data est périmé — lancer npm run generer:donnees && npm run generer:embeddings" && exit 1)

      # La régression visuelle vit dans son propre workflow : elle a besoin du
      # conteneur Playwright, et son échec ne doit pas se confondre avec celui
      # d'un test unitaire. Voir .github/workflows/visuel.yml.

  performance:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: verifier
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
