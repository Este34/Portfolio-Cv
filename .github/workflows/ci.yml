name: CI

on:
  push:
    branches: [master]
  pull_request:

# Une seule exécution par branche : pousser trois fois d'affilée ne doit pas
# occuper trois agents à vérifier des états déjà périmés.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Le modèle de vectorisation pèse plusieurs dizaines de méga-octets et ne
      # change qu'avec la constante qui le nomme : le mettre en cache évite de
      # le retélécharger à chaque exécution.
      - name: Cache du modèle de vectorisation
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: modele-${{ hashFiles('src/lib/rag-types.ts') }}

      # Placé en premier : c'est la vérification dont l'échec doit interrompre
      # tout le reste. Publier un nom d'organisme ne se rattrape pas.
      - name: Anonymisation
        run: npm run verifier:anonymat

      - name: Génération des données
        run: npm run generer:donnees

      - name: Génération des vecteurs
        run: npm run generer:embeddings

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Le contenu peut évoluer sans que personne ne relance la génération.
      # Si un artefact généré diffère de ce qui est versionné, le site servirait
      # des extraits désynchronisés de leurs vecteurs.
      - name: Les artefacts générés sont à jour
        run: git diff --exit-code -- public/data || (echo "::error::public/data est périmé — lancer npm run generer:donnees && npm run generer:embeddings" && exit 1)

      # La régression visuelle vit dans son propre workflow : elle a besoin du
      # conteneur Playwright, et son échec ne doit pas se confondre avec celui
      # d'un test unitaire. Voir .github/workflows/visuel.yml.

  performance:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: verifier
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
